			// Anniversary Start Date: September 7, 2025 at 9:21 PM
			var startDate = new Date(2025, 8, 7, 21, 21, 0); 

			function updateTimer() {
				var now = new Date();
				var diff = now - startDate;

				if (diff < 0) diff = 0; 

				var days = Math.floor(diff / (1000 * 60 * 60 * 24));
				var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
				var minutes = Math.floor((diff / (1000 * 60)) % 60);
				var seconds = Math.floor((diff / 1000) % 60);

				if (document.getElementById("h")) document.getElementById("h").innerText = hours;
				if (document.getElementById("m")) document.getElementById("m").innerText = minutes;
