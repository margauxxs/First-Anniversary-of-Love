<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary</title>
    <link rel="stylesheet" type="text/css" href="./css/format.css">
</head>
<body>

    <!-- Animated Background Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Anniversary Timer Header -->
    <div id="content">
        <div id="together">We have been together for</div>
        <div id="timer">
            <span id="d">00</span> days 
            <span id="h">00</span> hours 
            <span id="m">00</span> minutes 
            <span id="s">00</span> seconds
        </div>
    </div>

    <!-- Typewriter Intro Text -->
    <div id="typeDiv">
        <span id="txt1"></span><br>
        <span id="txt2"></span>
    </div>

    <!-- Heart Button Trigger -->
    <div id="heartTxt">
        <button id="button" onclick="play()" aria-label="Play Slideshow">❤️</button>
        <span id="clickMe">Click Me</span>
    </div>

    <!-- Photo Gallery Container -->
    <div id="imgTxt">
        <img id="img" src="" alt="Anniversary Memory">
        <div id="Txt"></div>
    </div>

    <!-- JavaScript Files -->
    <script type="text/javascript" src="./js/stars.js"></script>
    <script type="text/javascript" src="./js/typeWriter.js"></script>
    <script type="text/javascript" src="./js/date.js"></script>
    <script type="text/javascript" src="./js/playImg.js"></script>
</body>
</html>
