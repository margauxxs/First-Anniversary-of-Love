<!DOCTYPE HTML>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
		<meta charset="UTF-8">
		<title>Happy 1st Anniversary, Mahal!</title>
		<link rel="stylesheet" type="text/css" href="./css/format.css">
		<style>
			/* Unblock click pointer events */
			canvas { pointer-events: none !important; }
			
			#heartTxt {
				position: absolute;
				top: 70%;
				left: 0;
				right: 0;
				margin: auto;
				text-align: center;
				z-index: 9999 !important;
				pointer-events: auto !important;
			}
			
			#button {
				display: inline-block;
				width: 80px;
				height: 80px;
				background-color: transparent;
				border: none;
				outline: none;
				cursor: pointer;
				font-size: 55px;
				line-height: 80px;
				z-index: 10000 !important;
				pointer-events: auto !important;
			}
			
			#clickMe {
				display: block;
				font-size: 13px;
				color: #ffffff;
				letter-spacing: 1.5px;
				text-transform: uppercase;
				margin-top: 5px;
			}

			#imgTxt {
				display: none;
				position: absolute;
				top: 18%;
				left: 0;
				right: 0;
				margin: auto;
				text-align: center;
				z-index: 9999 !important;
			}

			#img {
				max-width: 85vw;
				max-height: 60vh;
				border-radius: 10px;
				box-shadow: 0 4px 15px rgba(0,0,0,0.5);
			}

			#Txt {
				font-size: 18px;
				color: #ffffff;
				font-weight: bold;
				margin-bottom: 10px;
				display: block;
			}
		</style>
	</head>

	<body style="margin:0px">
		<audio id="bgm" autoplay loop preload="auto">
			<source src="music/music.mp3" type="audio/mpeg">
		</audio>
		
		<canvas></canvas>

		<div id="typeDiv">
			<span id="txt1"></span> <br />
			<span id="txt2"></span>
		</div>

		<div id="content">
			<h2 id="together">Mahal, we have been together for</h2>
			<div id="timer">
				<b id="d">0</b> Days 
				<b id="h">00</b> Hours
				<b id="m">00</b> Minutes
				<b id="s">00</b> Seconds
			</div>
		</div>

		<!-- Interactive Heart Trigger -->
		<div id="heartTxt">
			<button id="button" onclick="play()">❤️</button>
			<span id="clickMe">Click Below</span>
		</div>

		<!-- Memory Gallery Display -->
		<div id="imgTxt">
			<span id="Txt"></span> <br />
			<img id="img" src="" alt="Our Memory">
		</div>

		<script type="text/javascript" src="./js/stars.js"></script>
		<script type="text/javascript" src="./js/typeWriter.js"></script>
		<script type="text/javascript" src="./js/date.js"></script>
		<script type="text/javascript" src="./js/playImg.js"></script>
	</body>
</html>
